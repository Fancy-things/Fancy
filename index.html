<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fancy Couture</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Georgia, serif; background: #f5d6e0; color: #1a1a1a; line-height: 1.6; }
        header { text-align: center; padding: 45px 20px 30px; background: #f5d6e0; }
        .logo-container { width: fit-content; margin: 0 auto; }
        .logo { max-width: 350px; width: 100%; display: block; }
        .signature { text-align: right; margin-top: 5px; font-style: italic; color: #5a2d00; }
        .cart-link { position: absolute; top: 24px; right: 24px; display: inline-flex; gap: 8px; align-items: center; padding: 10px 15px; color: white; background: #111; border-radius: 999px; text-decoration: none; font-weight: bold; }
        .cart-link svg { width: 22px; height: 22px; }
        .cart-count { min-width: 22px; text-align: center; border-radius: 50%; background: #d94d7a; padding: 0 5px; }
        .section { max-width: 1200px; margin: auto; padding: 65px 20px; }
        .section h2 { text-align: center; margin-bottom: 35px; font-size: 2.5rem; }
        .personalisation-section { display: flex; justify-content: center; margin-bottom: 30px; }
        .card { background: rgba(255,255,255,.55); border: 1px solid #efc4d8; border-radius: 20px; padding: 25px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,.08); max-width: 500px; }
        .card h3 { font-size: clamp(2rem, 3vw, 2.5rem); margin-bottom: 12px; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 24px; }
        .product-card { overflow: hidden; border-radius: 16px; background: rgba(255,255,255,.55); box-shadow: 0 4px 12px rgba(0,0,0,.1); }
        .gallery-link { display: block; text-decoration: none; color: inherit; }
        .gallery-img { width: 100%; height: 320px; object-fit: cover; display: block; transition: transform .3s ease; }
        .gallery-link:hover .gallery-img { transform: scale(1.03); }
        .product-card-info { padding: 15px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .product-card-info a { color: inherit; text-decoration: none; }
        .product-card-info h3 { font-size: 1.1rem; }
        .product-card-info p { color: #a64e37; font-weight: bold; }
        .icon-button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 8px; padding: 11px 13px; background: #d94d7a; color: white; font: bold 1rem Georgia, serif; cursor: pointer; }
        .icon-button:hover { background: #c93d6d; }
        .icon-button svg { width: 22px; height: 22px; }
        .contact { text-align: center; }
        .contact p { margin: 10px 0; font-size: 1.1rem; }
        footer { background: #111; color: white; text-align: center; padding: 30px; }
        @media (max-width: 600px) { .cart-link { top: 12px; right: 12px; padding: 8px 11px; } header { padding-top: 65px; } .section { padding: 45px 16px; } }
    </style>
</head>
<body>
<header>
    <a class="cart-link" href="cart.html" aria-label="Voir le panier">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
        Panier <span class="cart-count" id="cartCount">0</span>
    </a>
    <div class="logo-container">
        <img src="Fancy.png" alt="Fancy Couture Logo" class="logo">
        <p class="signature">Heartmade by Ire</p>
    </div>
</header>
<section class="section">
    <div class="personalisation-section"><div class="card"><h3>Personnalisation</h3><p>Un fermoir rouge, une lanière bleue et une moitié rose et une autre jaune ? So Fancy !</p></div></div>
</section>
<section class="section">
    <h2>Mes créations</h2>
    <div class="gallery" id="gallery"></div>
</section>
<section class="section contact"><h2>Contact</h2><p>Instagram : @fancy</p><p>Email : contact@fancy.fr</p></section>
<footer>© 2026 Fancy</footer>
<script>
    const CART_KEY = 'fancyCart';
    const products = Array.from({ length: 6 }, (_, index) => ({ id: `banane-xl-${index + 1}`, name: `Banane XL - modèle ${index + 1}`, price: 50, image: `photos/image${index + 1}.jpg` }));
    function getCart() { try { const cart = JSON.parse(localStorage.getItem(CART_KEY)); return Array.isArray(cart) ? cart : []; } catch { return []; } }
    function updateCartCount() { document.getElementById('cartCount').textContent = getCart().reduce((sum, item) => sum + (Number(item.quantity) || 0), 0); }
    function addToCart(id) {
        const product = products.find(item => item.id === id);
        if (!product) return;
        const cart = getCart();
        const existing = cart.find(item => item.id === id);
        if (existing) existing.quantity = (Number(existing.quantity) || 0) + 1;
        else cart.push({ ...product, quantity: 1 });
        localStorage.setItem(CART_KEY, JSON.stringify(cart));
        updateCartCount();
    }
    const gallery = document.getElementById('gallery');
    products.forEach(product => {
        const article = document.createElement('article');
        article.className = 'product-card';
        article.innerHTML = `<a href="product.html?image=${product.id.split('-').pop()}" class="gallery-link"><img src="${product.image}" alt="${product.name}" class="gallery-img"></a><div class="product-card-info"><a href="product.html?image=${product.id.split('-').pop()}"><h3>${product.name}</h3><p>50 €</p></a><button type="button" class="icon-button" aria-label="Ajouter ${product.name} au panier" title="Ajouter au panier"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg><span>Ajouter</span></button></div>`;
        article.querySelector('button').addEventListener('click', () => addToCart(product.id));
        gallery.appendChild(article);
    });
    updateCartCount();
</script>
</body>
</html>
