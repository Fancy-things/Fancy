<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fancy Couture</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Georgia, serif;
            background: #ffffff;
            color: #333;
            line-height: 1.6;
        }

        header {
            text-align: center;
            padding: 60px 20px;
            background: #faf7f5;
        }

        .logo-container {
            width: fit-content;
            margin: 0 auto;
        }
  
        .logo {
            max-width: 350px;
            display: block;
        }
  
        .signature {
            text-align: right;
            margin-top: 5px;
            font-style: italic;
            font-size: 1rem;
            color: #555;
        }
        
        .hero-title {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        .hero-text {
            font-size: 1.2rem;
            max-width: 700px;
            margin: auto;
        }

        .section {
            max-width: 1200px;
            margin: auto;
            padding: 80px 20px;
        }

        .section h2 {
            text-align: center;
            margin-bottom: 40px;
            font-size: 2.5rem;
        }

        .services {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            border: 1px solid #e5e5e5;
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }

        .card h3 {
            margin-bottom: 15px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .gallery-link {
            display: block;
            text-decoration: none;
            transition: transform 0.3s ease;
        }

        .gallery-link:hover {
            transform: translateY(-3px);
        }

        .gallery-img {
            width: 100%;
            height: 350px;
            object-fit: cover;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            transition: transform 0.3s ease;
            display: block;
        }

        .gallery-link:hover .gallery-img {
            transform: scale(1.03);
        }

        .contact {
            text-align: center;
        }

        .contact p {
            margin: 10px 0;
            font-size: 1.1rem;
        }

        footer {
            background: #111;
            color: white;
            text-align: center;
            padding: 30px;
        }

        a {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background: #000;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        a:hover {
            background: #444;
        }

    </style>
</head>

<body>

<header>
    <div class="logo-container">
        <img src="Fancy.png" alt="Fancy Couture Logo" class="logo">
        <p class="signature">
            Heartmade by Ire
        </p>
    </div>
</header>

<section class="section">

    <h2>Mes Services</h2>

    <div class="services">

        <div class="card">
            <h3>Créations sur mesure</h3>
            <p>
                Conception de pièces uniques adaptées à vos envies.
            </p>
        </div>

        <div class="card">
            <h3>Personnalisation</h3>
            <p>
                Broderies, modifications et finitions personnalisées.
            </p>
        </div>

    </div>

</section>

<section class="section">

    <h2>Mes créations</h2>
    <div class="gallery">

        <a href="product.html?image=1" class="gallery-link">
            <img src="photos/image1.jpg" alt="Sac Fancy 1" class="gallery-img">
        </a>

        <a href="product.html?image=2" class="gallery-link">
            <img src="photos/image2.jpg" alt="Sac Fancy 2" class="gallery-img">
        </a>

        <a href="product.html?image=3" class="gallery-link">
            <img src="photos/image3.jpg" alt="Sac Fancy 3" class="gallery-img">
        </a>

        <a href="product.html?image=4" class="gallery-link">
            <img src="photos/image4.jpg" alt="Sac Fancy 4" class="gallery-img">
        </a>

        <a href="product.html?image=5" class="gallery-link">
            <img src="photos/image5.jpg" alt="Sac Fancy 5" class="gallery-img">
        </a>

        <a href="product.html?image=6" class="gallery-link">
            <img src="photos/image6.jpg" alt="Sac Fancy 6" class="gallery-img">
        </a>

    </div>

</section>

<section class="section contact">

    <h2>Contact</h2>

    <p>Instagram : @fancy</p>

    <p>Email : contact@fancy.fr</p>

</section>

<footer>
    © 2026 Fancy
</footer>

</body>

</html>
