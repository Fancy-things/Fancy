<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fancy Couture</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Georgia, serif;
            background: #f5d6e0;
            color: #1a1a1a;
            line-height: 1.6;
        }

        header {
            text-align: center;
            padding: 60px 20px;
            background: #f5d6e0;
        }

        .logo-container {
            width: fit-content;
            margin: 0 auto;
        }

        .logo {
            max-width: 350px;
            display: block;
        }

        .signature {
            text-align: right;
            margin-top: 5px;
            font-style: italic;
            font-size: 1rem;
            color: #5a2d00;
        }

        .section {
            max-width: 1200px;
            margin: auto;
            padding: 80px 20px;
        }

        .section h2 {
            text-align: center;
            margin-bottom: 40px;
            font-size: 2.5rem;
            color: #1a1a1a;
        }

        .personalisation-section {
            display: flex;
            justify-content: center;
            margin-bottom: 80px;
        }

        .card {
            background: rgba(255,255,255,0.55);
            border: 1px solid #efc4d8;
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            color: #1a1a1a;
            min-height: 180px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            max-width: 500px;
        }

        .card h3 {
            font-size: clamp(2rem, 3vw, 2.5rem);
            margin-bottom: 18px;
            font-weight: 700;
        }

        .card p {
            font-size: 1.1rem;
            line-height: 1.5;
            margin: 0;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .gallery-link {
            display: block;
            text-decoration: none;
            transition: transform 0.3s ease;
        }

        .gallery-link:hover {
            transform: translateY(-3px);
        }

        .gallery-img {
            width: 100%;
            height: 350px;
            object-fit: cover;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            display: block;
            transition: transform 0.3s ease;
        }

        .gallery-link:hover .gallery-img {
            transform: scale(1.03);
        }

        .contact {
            text-align: center;
        }

        .contact p {
            margin: 10px 0;
            font-size: 1.1rem;
            color: #1a1a1a;
        }

        footer {
            background: #111;
            color: white;
            text-align: center;
            padding: 30px;
        }

    </style>
</head>

<body>

<header>
    <div class="logo-container">
        <img src="Fancy.png" alt="Fancy Couture Logo" class="logo">
        <p class="signature">
            Heartmade by Ire
        </p>
    </div>
</header>

<section class="section">
    <div class="personalisation-section">
        <div class="card">
            <h3>Personnalisation</h3>
            <p>Un fermoir rouge, une lanière bleue et une moitié rose et une autre jaune? So Fancy!</p>
        </div>
    </div>
</section>

<section class="section">
    <h2>Mes créations</h2>
    <div class="gallery">
        <a href="product.html?image=1" class="gallery-link">
            <img src="photos/image1.jpg" alt="Banane XL 1" class="gallery-img">
        </a>
        <a href="product.html?image=2" class="gallery-link">
            <img src="photos/image2.jpg" alt="Banane XL 2" class="gallery-img">
        </a>
        <a href="product.html?image=3" class="gallery-link">
            <img src="photos/image3.jpg" alt="Banane XL 3" class="gallery-img">
        </a>
        <a href="product.html?image=4" class="gallery-link">
            <img src="photos/image4.jpg" alt="Banane XL 4" class="gallery-img">
        </a>
        <a href="product.html?image=5" class="gallery-link">
            <img src="photos/image5.jpg" alt="Banane XL 5" class="gallery-img">
        </a>
        <a href="product.html?image=6" class="gallery-link">
            <img src="photos/image6.jpg" alt="Banane XL 6" class="gallery-img">
        </a>
    </div>
</section>

<section class="section contact">
    <h2>Contact</h2>
    <p>Instagram : @fancy</p>
    <p>Email : contact@fancy.fr</p>
</section>

<footer>
    © 2026 Fancy
</footer>

</body>

</html>
