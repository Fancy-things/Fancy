<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panier - Fancy Couture</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Georgia, serif;
            background: linear-gradient(180deg, #f7c4d1 0%, #fff4e8 100%);
            color: #1a1a1a;
            line-height: 1.6;
        }

        header {
            text-align: center;
            padding: 60px 20px 30px;
            background: #f7c4d1;
        }

        .logo-container {
            width: fit-content;
            margin: 0 auto;
        }

        .logo {
            max-width: 350px;
            display: block;
        }

        .signature {
            text-align: right;
            margin-top: 5px;
            font-style: italic;
            font-size: 1rem;
            color: #5a2d00;
        }

        .cart-page {
            max-width: 1000px;
            margin: 40px auto 80px;
            padding: 0 20px;
        }

        .cart-title {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5rem;
        }

        .cart-item {
            display: grid;
            grid-template-columns: 120px 1fr auto auto;
            align-items: center;
            gap: 20px;
            background: rgba(255,255,255,0.45);
            border: 1px solid #efc4d8;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .cart-item img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 12px;
        }

        .cart-item h3 {
            font-size: 1.5rem;
            margin-bottom: 6px;
        }

        .cart-item .price {
            font-size: 1.2rem;
            font-weight: bold;
            color: #d96f4d;
        }

        .quantity-control {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255,255,255,0.4);
            border-radius: 10px;
            padding: 8px 12px;
        }

        .quantity-control button {
            width: 30px;
            height: 30px;
            border: none;
            border-radius: 50%;
            background: #ff9b6b;
            color: #111;
            font-size: 1.2rem;
            cursor: pointer;
            font-weight: bold;
        }

        .remove-btn {
            background: #111;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 14px;
            cursor: pointer;
            font-weight: bold;
        }

        .cart-summary {
            background: rgba(255,255,255,0.45);
            border: 1px solid #efc4d8;
            border-radius: 16px;
            padding: 24px;
            margin-top: 30px;
        }

        .cart-summary h3 {
            margin-bottom: 15px;
            font-size: 1.6rem;
        }

        .total {
            display: flex;
            justify-content: space-between;
            font-size: 1.4rem;
            font-weight: bold;
            margin-top: 10px;
        }

        .empty-cart {
            text-align: center;
            background: rgba(255,255,255,0.45);
            border: 1px solid #efc4d8;
            border-radius: 16px;
            padding: 40px 20px;
            font-size: 1.2rem;
        }

        .actions {
            margin-top: 30px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .primary-btn,
        .secondary-btn {
            display: inline-block;
            padding: 14px 22px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            text-align: center;
            border: none;
            cursor: pointer;
        }

        .primary-btn {
            background: #111;
            color: white;
        }

        .secondary-btn {
            background: #ff9b6b;
            color: #111;
        }

        @media (max-width: 768px) {
            .cart-item {
                grid-template-columns: 1fr;
                text-align: center;
            }

            .cart-item img {
                max-width: 200px;
                margin: 0 auto;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo-container">
        <img src="Fancy.png" alt="Fancy Couture Logo" class="logo">
        <p class="signature">
            Heartmade by Ire
        </p>
    </div>
</header>

<div class="cart-page">
    <h1 class="cart-title">Mon panier</h1>
    <div id="cartContainer"></div>
</div>

<script>
    const CART_KEY = 'fancyCart';

    function getCart() {
        try {
            return JSON.parse(localStorage.getItem(CART_KEY)) || [];
        } catch (error) {
            return [];
        }
    }

    function saveCart(cart) {
        localStorage.setItem(CART_KEY, JSON.stringify(cart));
    }

    function formatPrice(value) {
        return `${value} €`;
    }

    function renderCart() {
        const cart = getCart();
        const container = document.getElementById('cartContainer');

        if (!cart.length) {
            container.innerHTML = `
                <div class="empty-cart">
                    Votre panier est vide.<br>
                    <div class="actions">
                        <a href="index.html" class="primary-btn">Retour à la galerie</a>
                    </div>
                </div>
            `;
            return;
        }

        let total = 0;

        cart.forEach(item => {
            total += item.price * item.quantity;
        });

        container.innerHTML = `
            ${cart.map(item => `
                <div class="cart-item">
                    <img src="${item.image}" alt="${item.name}">
                    <div>
                        <h3>${item.name}</h3>
                        <div class="price">${formatPrice(item.price)}</div>
                    </div>
                    <div class="quantity-control">
                        <button onclick="updateQuantity('${item.id}', -1)">-</button>
                        <span>${item.quantity}</span>
                        <button onclick="updateQuantity('${item.id}', 1)">+</button>
                    </div>
                    <button class="remove-btn" onclick="removeItem('${item.id}')">Supprimer</button>
                </div>
            `).join('')}

            <div class="cart-summary">
                <h3>Résumé</h3>
                <div class="total">
                    <span>Total</span>
                    <span>${formatPrice(total)}</span>
                </div>
                <div class="actions">
                    <a href="index.html" class="secondary-btn">Continuer</a>
                    <a href="mailto:contact@fancy.fr?subject=Commande%20Fancy&body=Bonjour%2C%20je%20souhaite%20passer%20commande%20avec%20le%20panier%20suivant%20%3A%0A${encodeURIComponent(JSON.stringify(cart))}" class="primary-btn">Commander</a>
                </div>
            </div>
        `;
    }

    function updateQuantity(productId, change) {
        const cart = getCart();
        const index = cart.findIndex(item => item.id === productId);

        if (index === -1) return;

        cart[index].quantity += change;

        if (cart[index].quantity <= 0) {
            cart.splice(index, 1);
        }

        saveCart(cart);
        renderCart();
    }

    function removeItem(productId) {
        const cart = getCart().filter(item => item.id !== productId);
        saveCart(cart);
        renderCart();
    }

    renderCart();
</script>

</body>

</html>
